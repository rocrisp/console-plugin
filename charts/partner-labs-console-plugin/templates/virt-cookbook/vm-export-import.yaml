{{- if (index .Values.plugin.quickStarts "vm-export-import").enabled }}
apiVersion: console.openshift.io/v1
kind: ConsoleQuickStart
metadata:
  name: vm-export-import
  labels:
    {{- include "partner-labs-console-plugin.labels" . | nindent 4 }}
spec:
  displayName: "Exporting and Importing VMs for Cross-Cluster Mobility"
  description: "Export a VM disk to a registry, import it on another cluster, and recreate the VM."
  durationMinutes: 90
  tags:
    - virtualization
    - export
    - import
    - backup
    - sharing
  prerequisites:
    - "OpenShift 4.22 with OpenShift Virtualization and console access on both clusters"
    - "Permission to create projects, VMs, bootable volumes, and registry upload resources"
    - "VM-capable workers, a suitable default StorageClass, and available compute and storage"
    - "A Linux template with a ready boot source"
    - "A registry reachable from both clusters, with push and pull credentials"
    - "Optional downloads: oc, a matching virtctl, source cluster login, and local disk space"
    - "Optional backups: an S3-compatible bucket"
  introduction: |-
    Export a test VM's disk and recreate the VM on the target cluster.
    For one-cluster practice, use separate source and target projects.

    For explanations and CLI alternatives, see the
    [OpenShift Virtualization cookbook](https://redhatquickcourses.github.io/ocp-virt-cookbook/ocp-virt-cookbook/1/vm-lifecycle/vm-export-import.html).
  tasks:
    - title: "Prepare the source and target projects"
      description: |-
        1. In the source cluster's Administrator navigation, open
           **Home → Projects → Create Project**.
           Create `vm-export-demo`.
        2. In a second tab, open the target cluster and create `vm-import-demo`.
        3. In each tab, open **Virtualization → VirtualMachines** and select
           the corresponding project.
      review:
        instructions: "Are vm-export-demo and vm-import-demo selected on the source and target?"
        failedTaskHelp: "Check cluster and project access. Ask your administrator to create the projects if needed."
      summary:
        success: "Source and target projects are selected."
        failed: "Select the source and target projects."

    - title: "Create a source VM from a template"
      description: |-
        1. In `vm-export-demo`, click **Create → Create from Template**.
           Name the VM `app-server` and click **Next**.
        2. Select a Linux template with a ready boot source and click **Next**.
        3. On **Customization**, use one persistent boot disk and the default
           pod network. Configure guest credentials under **Initial run** or **SSH**.
        4. On **Review and create**, select **Start this VirtualMachine after
           creation** and click **Create VirtualMachine**.
        5. Wait for **Running**, then open **Console** to check the guest display.
      review:
        instructions: "Is app-server Running with a guest display?"
        failedTaskHelp: "Check the template boot source, disk status, and VM Events."
      summary:
        success: "The source VM is running."
        failed: "Resolve source VM provisioning or boot errors."

    - title: "Stop the source VM and record its settings"
      description: |-
        1. Record the VM's OS, architecture, compute, firmware, disk interfaces,
           boot order, network, and initialization settings from **Configuration**
           and **YAML**.
        2. Under **Configuration → Storage**, record the boot disk's PVC name,
           capacity, and StorageClass.
        3. Click **Actions → Stop**. Wait for **Stopped** and keep the source
           stopped through the copy and upload.
      review:
        instructions: "Is the source Stopped, with its disk and VM settings recorded?"
        failedTaskHelp: "Check Events for shutdown errors and YAML for disk and VM settings."
      summary:
        success: "The source is stopped and its settings are recorded."
        failed: "Stop the source and record its settings."

    - title: "Save the boot disk as a bootable volume"
      description: |-
        1. Open **Configuration → Storage** on the stopped source VM.
        2. From the boot disk's options menu, select **Save as bootable volume**.
        3. Set **Volume name** to `app-server-image` and **Destination project**
           to `vm-export-demo`. Confirm disk size and StorageClass.
        4. Select the matching OS preference and architecture. Click **Save**.
        5. Open **Virtualization → Bootable volumes** and wait for
           `app-server-image` to be ready.
      review:
        instructions: "Is app-server-image ready in vm-export-demo?"
        failedTaskHelp: "Check the OS preference, disk clone, storage capacity, and events."
      summary:
        success: "The bootable volume is ready."
        failed: "Resolve bootable volume provisioning errors."

    - title: "Export the disk to a container registry"
      description: |-
        1. From `app-server-image`'s options menu, select **Upload to registry**.
        2. Set **Destination** to `quay.io/<quay-username>/vm-images:app-server`,
           replacing `<quay-username>` with your account or organization.
        3. Enter push credentials and click **Save**. Use a repository whose
           visibility is appropriate for the guest files and credentials on the disk.
        4. Wait for **Succeeded**, click **Close**, and verify the tag in the registry.
      review:
        instructions: "Did the upload succeed, with the app-server tag visible in the registry?"
        failedTaskHelp: "Check push permissions, registry connectivity, and the upload dialog's pod log link."
      summary:
        success: "The disk image is in the registry."
        failed: "Resolve the registry upload error."

    - title: "Import the disk on the target cluster"
      description: |-
        1. On the target, select `vm-import-demo` and open
           **Virtualization → VirtualMachines → Create → Custom configuration**.
        2. Name the VM `app-server`, confirm **Location**, and click **Next**.
        3. Select the source guest OS and version, then click **Next**.
        4. On **Boot source**, select **Boot volume → Add volume**.
        5. Choose **Registry** under **Import from**. Enter the exported image
           reference and pull credentials for a private repository.
        6. Set **Volume name** to `app-server-image`, **Destination project** to
           `vm-import-demo`, and **Disk size** to at least the source capacity.
           Select the target StorageClass, OS preference, and architecture.
           Review **Retain revisions** and **Cron expression**.
        7. Click **Save** and select the imported volume as **Boot source**.
           Leave the wizard open.

        For a local disk, use **Upload new → Volume**; for an HTTPS disk, use **URL**.
      review:
        instructions: "Is app-server-image selected as the target boot source?"
        failedTaskHelp: "Check the image reference, pull credentials, capacity, connectivity, and DataVolume events."
      summary:
        success: "The imported boot source is selected."
        failed: "Complete the import and select its bootable volume."

    - title: "Recreate the VM with the imported disk"
      description: |-
        1. Click **Next**. On **Compute resources**, match the source's compute settings.
        2. On **Customization**, match firmware, disk interfaces, boot order,
           network, and initialization settings. Recreate required secrets and
           network attachments on the target.
        3. Confirm the boot source is `app-server-image`.
        4. On **Review and create**, clear **Start this VirtualMachine after
           creation** and click **Create VirtualMachine**.
        5. Check **Configuration → Storage** and **Events** for provisioning errors.
           Storage that waits for a consumer binds when you start the VM.
      review:
        instructions: "Does the target VM use the imported disk and recorded source settings?"
        failedTaskHelp: "Compare target YAML and Storage with the source settings; check quota and storage events."
      summary:
        success: "The target VM is configured."
        failed: "Correct the target disk and VM settings."

    - title: "Verify the imported VM"
      description: |-
        1. Click **Actions → Start** on the target VM. Wait for **Running**.
        2. Open **Console** and log in with the guest credentials.
        3. Verify expected files, applications, and network connectivity.
        4. Keep the source stopped while the target serves the workload.

        Continue with the optional tasks or skip to cleanup.
      review:
        instructions: "Is the target Running with the expected guest data and applications?"
        failedTaskHelp: "Check Events, disk status, the guest console, and the recorded source settings."
      summary:
        success: "The imported guest runs on the target."
        failed: "Resolve target boot or data errors."

    - title: "Download disks and manifests for offline use (optional CLI)"
      description: |-
        Skip if you only need the registry workflow.

        1. Keep the source VM stopped. Log in to the source with `oc` on your workstation.
        2. Create an export:

           ```bash
           virtctl vmexport create app-server-export --vm=app-server --ttl=2h -n vm-export-demo
           ```

        3. Replace `<source-root-pvc>` with the PVC recorded under
           **Configuration → Storage**, then download the disk and manifest:

           ```bash
           virtctl vmexport download app-server-export --volume=<source-root-pvc> --output=app-server-root.img --keep-vme -n vm-export-demo
           virtctl vmexport download app-server-export --manifest --output=app-server-manifest.yaml --keep-vme -n vm-export-demo
           ```

        4. Confirm both files exist. Review source-specific references before
           reusing the manifest. Add `--port-forward` if the export Route is unreachable.
      review:
        instructions: "Are the disk and manifest downloaded, or did you skip this task?"
        failedTaskHelp: "Check source login, PVC name, certificate trust, export expiry, and local disk space."
      summary:
        success: "Offline files are downloaded, or this task was skipped."
        failed: "Resolve the download error or skip this task."

    - title: "Back up to S3-compatible storage (optional)"
      description: |-
        1. Complete the download task. In your storage provider's console, upload
           the disk and manifest to `vm-backups/app-server/` in your backup bucket.
        2. Verify object names and sizes; configure retention or versioning.
        3. To test a restore, generate a presigned HTTPS disk URL valid for the import.
        4. On the target, use **Create → Custom configuration → Boot source →
           Add volume → URL**. Enter the URL and use an unused VM and volume name.
        5. Recreate and verify the VM as above.
      review:
        instructions: "Are the backup objects present and the restore VM working, or did you skip this task?"
        failedTaskHelp: "Check bucket permissions, URL expiry, certificate trust, and target connectivity. See the cookbook for presign commands."
      summary:
        success: "The backup and restore are verified, or this task was skipped."
        failed: "Resolve the backup or restore error, or skip this task."

    - title: "Share VM images (optional)"
      description: |-
        1. On the target, find `app-server-image` under **Virtualization → Bootable volumes**.
        2. In **Home → Search**, inspect its **DataSource** and **DataImportCron**.
           Review the import's **Cron expression** and **Retain revisions** settings.
        3. Create another test VM with an unused name and select this bootable volume.
        4. For another project, repeat **Add volume → Registry** there with pull credentials.

        Image refreshes apply to new VMs; existing VM disks are unchanged.
      review:
        instructions: "Can you select the shared boot source for a new VM, or did you skip this task?"
        failedTaskHelp: "Check DataSource readiness, DataImportCron events, and registry credentials."
      summary:
        success: "The shared boot source is available, or this task was skipped."
        failed: "Check the bootable volume and import resources."

    - title: "Verify data integrity (optional local checks)"
      description: |-
        1. Verify target disk imports in **Configuration → Storage** and **Events**.
           Check expected guest files and applications in **Console**.
        2. Immediately after a local disk download, record its checksum:

           ```bash
           sha256sum app-server-root.img > app-server-root.sha256
           ```

        3. Store the checksum with the backup. After retrieving the disk, compare:

           ```bash
           sha256sum -c app-server-root.sha256
           ```

        On macOS, replace `sha256sum` with `shasum -a 256`.
        Compare the same disk file before and after transfer.
      review:
        instructions: "Does the guest work, and do checked files match their saved checksums?"
        failedTaskHelp: "Inspect guest errors. Download a mismatched file again before importing it; skip local checks if you have no files."
      summary:
        success: "Guest data and any local checksums are verified."
        failed: "Resolve guest errors or checksum mismatches."

    - title: "Automate export and import workflows (optional CLI)"
      description: |-
        1. Keep the source stopped and create an export as in the download task.
           Download the manifest first if needed.
        2. Replace `<source-root-pvc>` and run an unattended disk download:

           ```bash
           virtctl vmexport download app-server-export --volume=<source-root-pvc> --output=app-server-root.img --retry=3 --readiness-timeout=10m --delete-vme -n vm-export-demo
           ```

        3. Continue only after successful download, checksum verification, disk
           import, and guest checks. The command deletes the export after downloading.

        See the cookbook for scheduling and pipeline examples.
      review:
        instructions: "Did the automated download complete and remove its export, or did you skip this task?"
        failedTaskHelp: "Check source state, export readiness, certificate trust, and command errors."
      summary:
        success: "The unattended download completed, or this task was skipped."
        failed: "Resolve the download error or skip automation."

    - title: "Troubleshoot in the web console"
      description: |-
        If a task failed, inspect:

        1. **Upload:** the upload dialog's pod log link, or **Workloads → Pods → Logs**.
        2. **Import:** bootable volume status and related DataVolume/importer pod
           **Events** and **Logs**.
        3. **Guest boot:** VM **Console**, **Events**, boot order, firmware, and disk settings.
        4. **Offline export:** **Home → Search → VirtualMachineExport** for readiness
           and expiry. Recreate expired exports.

        See the cookbook for detailed troubleshooting.
      review:
        instructions: "Did you find the failed resource's events or logs, or did all tasks succeed?"
        failedTaskHelp: "Confirm the cluster and project; ask your administrator for access to hidden resources."
      summary:
        success: "Failures are located, or no troubleshooting was needed."
        failed: "Find the failing resource's status, events, or logs."

    - title: "Keep or remove the tutorial resources"
      description: |-
        1. To keep a VM, use **Actions → Stop**.
        2. To remove it, use **Actions → Delete** and review associated disk choices.
        3. Under **Virtualization → Bootable volumes**, delete unwanted tutorial
           volumes. Check related DataSources, DataImportCrons, and PVCs.
        4. In **Home → Search** and **Workloads → Pods**, remove unneeded tutorial
           exports, upload pods, and credential secrets.
        5. Delete a dedicated project from **Home → Projects** only after confirming
           all its contents are disposable.
        6. Remove unwanted registry tags, bucket objects, and local downloads.

        Deleting disks or backups permanently removes their data.
      review:
        instructions: "Are tutorial resources stopped, retained, or deleted as intended on both clusters?"
        failedTaskHelp: "Review both projects, retained disks, import resources, registry tags, and backup files."
      summary:
        success: "Tutorial resources are kept or removed as intended."
        failed: "Review remaining tutorial resources."
  conclusion: |-
    You exported a VM disk, recreated the VM on the target, and verified the guest.

    For explanations and more examples, see the
    [OpenShift Virtualization cookbook](https://redhatquickcourses.github.io/ocp-virt-cookbook/ocp-virt-cookbook/1/vm-lifecycle/vm-export-import.html).
  nextQuickStart: []
{{- end }}
